<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="A small set of favourite photos by Tyler Hannan, from Amsterdam, Efteling and Melbourne to Santorini and Portmeirion.">
<link rel="canonical" href="https://tylerhannan.com/photos/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tyler Hannan">
<meta property="og:title" content="Photos · Tyler Hannan">
<meta property="og:description" content="A small set of favourite photos by Tyler Hannan, from Amsterdam, Efteling and Melbourne to Santorini and Portmeirion.">
<meta property="og:url" content="https://tylerhannan.com/photos/">
<meta property="og:image" content="https://tylerhannan.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/site.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/">← tylerhannan.com</a><button type="button" class="theme" aria-label="Switch to light mode">☀ light</button></div>
  <section style="padding-top:24px">
    <p class="label">Photos</p>
    <div class="query" data-run><span class="p">:) </span><span class="kw">SELECT</span> *
   <span class="kw">FROM</span> photos
   <span class="kw">ORDER BY</span> date <span class="kw">DESC</span>;</div>
    <div class="photos" id="photo-grid"></div>
    <p class="foot" id="photo-foot"></p>
  </section>

  <section id="contact" aria-labelledby="contact-h">
    <p class="label" id="contact-h">Contact</p>
    <div class="contact">
      <span><span id="email">tyler@tylerhannan.com</span><button class="copy" id="copy" type="button">copy</button></span>
      <a href="https://www.linkedin.com/in/tylerhannan/">linkedin</a>
      <a href="https://twitter.com/tylerhannan">x / twitter</a>
    </div>
  </section>

  <footer><span>tylerhannan.com · colours: <a href="https://github.com/jan-warchol/selenized">selenized</a></span><span class="fl"><a href="/">home</a><a href="/photos/">photos</a><a href="/archive/">writing archive</a></span></footer>
</div>

<dialog id="lightbox" aria-label="Photo">
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <div class="lb-bar">
    <span class="lb-nav"><button type="button" class="copy" id="lb-close">close</button><button type="button" class="copy" id="lb-link">copy link</button></span>
    <span class="lb-nav"><span id="lb-pos"></span><button type="button" class="copy" id="lb-prev" aria-label="Previous photo">‹ prev</button><button type="button" class="copy" id="lb-next" aria-label="Next photo">next ›</button></span>
  </div>
</dialog>

<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var ym=function(d){return String(d).slice(0,7)};
  var grid=document.getElementById('photo-grid'), list=[];

  function render(){
    if(!list.length){ grid.outerHTML='<div class="empty-state">0 rows in set. Add photos with <code>scripts/add-photo.sh</code>.</div>'; return; }
    list.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
    grid.innerHTML=list.map(function(p,i){
      var meta=[p.place,p.date&&ym(p.date)].filter(Boolean).map(esc).join(' · ');
      var focus=/^(top|bottom|left|right|center)$/.test(p.focus)?' style="object-position:'+p.focus+'"':'';  // which edge the grid crop keeps
      var inner=p.file?'<img src="/photos/'+esc(p.file)+'" alt="'+esc(p.alt||p.title)+'" loading="lazy"'+focus+'>':'<span class="ph">'+(p.example?'example slot':'no file')+'</span>';
      return '<button type="button" class="photo'+(p.file?'':' empty')+'" data-i="'+i+'"'+(p.file?'':' disabled')+'>'+inner+'<span class="pc"><span class="vt">'+esc(p.title)+'</span><span class="vm">'+meta+'</span></span></button>';
    }).join('');
    var real=list.filter(function(p){return p.file}).length;
    document.getElementById('photo-foot').textContent=list.length+' rows in set'+(real<list.length?' ('+(list.length-real)+' example)':'')+'.';
  }

  var lb=document.getElementById('lightbox');
  var cur=-1;
  // Each photo has its own URL (/photos/#<file name>): Back closes the viewer, and the link can be shared.
  var slug=function(p){return p.file.replace(/\.[^.]+$/,'')};
  function open(i,push){
    show(i);
    var p=list.filter(function(q){return q.file})[cur];
    if(push) history.pushState({photo:true},'','#'+slug(p));
    if(lb.showModal&&!lb.open) lb.showModal();
  }
  function fromHash(){
    var h=decodeURIComponent(location.hash.slice(1)), real=list.filter(function(q){return q.file});
    for(var i=0;i<real.length;i++) if(slug(real[i])===h) return i;
    return -1;
  }
  // Viewer steps through real photos only (example slots have no file), wrapping at the ends.
  function show(i){
    var real=list.filter(function(p){return p.file}); if(!real.length) return;
    cur=(i+real.length)%real.length;
    var p=real[cur];
    document.getElementById('lb-img').src='/photos/'+p.file;
    document.getElementById('lb-img').alt=p.alt||p.title;
    document.getElementById('lb-cap').textContent=[p.title,p.place,p.date,p.camera].filter(Boolean).join(' · ');
    document.getElementById('lb-pos').textContent=(cur+1)+' / '+real.length;
    document.getElementById('lb-prev').parentNode.hidden=real.length<2;
    if(lb.open) history.replaceState(history.state,'','#'+slug(p));  // prev/next update the URL without piling up history
    var nx=real[(cur+1)%real.length]; if(nx!==p) new Image().src='/photos/'+nx.file;  // preload next
  }
  grid.addEventListener('click',function(e){
    var b=e.target.closest('.photo'); if(!b||b.disabled) return;
    var p=list[+b.dataset.i];
    open(list.filter(function(q){return q.file}).indexOf(p),true);
  });
  document.getElementById('lb-prev').addEventListener('click',function(){show(cur-1)});
  document.getElementById('lb-next').addEventListener('click',function(){show(cur+1)});
  lb.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){ e.preventDefault(); show(cur+1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); show(cur-1); }
  });
  var sx=null, sy=0;
  lb.addEventListener('touchstart',function(e){ if(e.touches.length===1){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } },{passive:true});
  lb.addEventListener('touchend',function(e){
    if(sx===null) return;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) show(dx<0?cur+1:cur-1);
  });
  // Every way of closing (button, Esc, backdrop) goes through here so the URL returns to the plain gallery.
  // If opening pushed a history entry, step back over it; for a shared link, just drop the #photo.
  function closeViewer(){
    if(!lb.open) return;
    lb.close();
    if(history.state&&history.state.photo) history.back();
    else history.replaceState(null,'',location.pathname+location.search);
  }
  document.getElementById('lb-close').addEventListener('click',closeViewer);
  lb.addEventListener('cancel',function(e){ e.preventDefault(); closeViewer(); });  // Esc
  window.addEventListener('popstate',function(){  // browser Back/Forward
    var i=fromHash();
    if(i<0){ if(lb.open) lb.close(); }
    else open(i,false);
  });
  document.getElementById('lb-link').addEventListener('click',function(){
    var b=this, url=location.origin+location.pathname+location.hash;
    var done=function(){b.textContent='copied';setTimeout(function(){b.textContent='copy link'},1500)};
    try{ navigator.clipboard.writeText(url).then(done,function(){prompt('Link to this photo:',url)}); }catch(_){ prompt('Link to this photo:',url); }
  });
  lb.addEventListener('click',function(e){ if(e.target===lb) closeViewer(); });

  fetch('/photos.json').then(function(r){return r.json()}).then(function(d){list=d.photos||[];render();var i=fromHash();if(i>=0) open(i,false);}).catch(function(){render()});
})();
</script>
<script src="/run.js" defer></script>
</body>
</html>
