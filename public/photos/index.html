<body>
<div class="wrap">
  <div class="top"><a class="back" href="/">← tylerhannan.com</a><button type="button" class="theme" aria-label="Switch to light mode">☀ light</button></div>
  <section style="padding-top:24px">
    <p class="label">Photos</p>
    <form class="query search" id="search-form" role="search" style="margin-bottom:16px"><span class="p">:) </span><input id="search-q" type="search" name="q" maxlength="200" autocomplete="off" spellcheck="false" placeholder="search by what's in the shot: night sky, water, neon…" aria-label="Search photos by what's in them"></form>
    <div class="query" data-run id="photo-sql"><span class="p">:) </span><span class="kw">SELECT</span> *
   <span class="kw">FROM</span> photos
   <span class="kw">ORDER BY</span> date <span class="kw">DESC</span>;</div>
    <div class="photos" id="photo-grid"></div>
    <p class="foot" id="photo-foot"></p>
  </section>

  <section id="contact" aria-labelledby="contact-h">
    <p class="label" id="contact-h">Contact</p>
    <div class="contact">
      <span><span id="email">tyler@tylerhannan.com</span><button class="copy" id="copy" type="button">copy</button></span>
      <a href="https://www.linkedin.com/in/tylerhannan/">linkedin</a>
      <a href="https://twitter.com/tylerhannan">x / twitter</a>
    </div>
  </section>

  <footer><span>tylerhannan.com · colours: <a href="https://github.com/jan-warchol/selenized">selenized</a></span><span class="fl"><a href="/">home</a><a href="/search/">search</a><a href="/photos/">photos</a><a href="/archive/">writing archive</a></span></footer>
</div>

<dialog id="lightbox" aria-label="Photo">
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <div class="lb-bar">
    <span class="lb-nav"><button type="button" class="copy" id="lb-close">close</button><button type="button" class="copy" id="lb-link">copy link</button></span>
    <span class="lb-nav"><span id="lb-pos"></span><button type="button" class="copy" id="lb-prev" aria-label="Previous photo">‹ prev</button><button type="button" class="copy" id="lb-next" aria-label="Next photo">next ›</button></span>
  </div>
</dialog>

<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var ym=function(d){return String(d).slice(0,7)};
  var grid=document.getElementById('photo-grid'), list=[];
  document.addEventListener('error',function(e){ var t=e.target; if(t.dataset&&t.dataset.full&&t.src.indexOf(t.dataset.full)<0) t.src=t.dataset.full; },true);  // missing thumbnail: use the full photo
  var rank=null, note='';  // after a search: file -> similarity, and its footnote

  function render(){
    if(!list.length){ grid.outerHTML='<div class="empty-state">0 rows in set.</div>'; return; }
    list.sort(rank?function(a,b){ var x=rank[a.file], y=rank[b.file];
      return (isNaN(x)-isNaN(y)) || y-x || (a.file<b.file?-1:a.file>b.file?1:0); }
      :function(a,b){return String(b.date).localeCompare(String(a.date))});
    grid.innerHTML=list.map(function(p,i){
      var meta=[rank&&p.file in rank?rank[p.file].toFixed(2):'',p.place,p.date&&ym(p.date)].filter(Boolean).map(esc).join(' · ');
      var focus=/^(top|bottom|left|right|center)$/.test(p.focus)?' style="object-position:'+p.focus+'"':'';  // which edge the grid crop keeps
      // grid uses the 600px thumbnail; fall back to the full photo if a thumbnail is missing
      var inner=p.file?'<img src="/photos/thumbs/'+esc(p.file)+'" alt="'+esc(p.alt||p.title)+'" loading="lazy" decoding="async"'+focus+' data-full="/photos/'+esc(p.file)+'">':'<span class="ph">'+(p.example?'example slot':'no file')+'</span>';
      return '<button type="button" class="photo'+(p.file?'':' empty')+'" data-i="'+i+'"'+(p.file?'':' disabled')+'>'+inner+'<span class="pc"><span class="vt">'+esc(p.title)+'</span><span class="vm">'+meta+'</span></span></button>';
    }).join('');
    var real=list.filter(function(p){return p.file}).length;
    document.getElementById('photo-foot').textContent=rank&&note||list.length+' rows in set'+(real<list.length?' ('+(list.length-real)+' example)':'')+'.';
  }

  // Search by what's in a shot. Each photo's vector comes from its title, alt text and place.
  var sqlBox=document.getElementById('photo-sql'), byDate=sqlBox.innerHTML, input=document.getElementById('search-q');
  var BY_MEANING='<span class="p">:) </span><span class="kw">WITH</span>\n     (<span class="kw">SELECT</span> embedding <span class="kw">FROM</span> request) <span class="kw">AS</span> words\n   <span class="kw">SELECT</span> <span class="kw">round</span>(<span class="n">1</span> - <span class="kw">cosineDistance</span>(embedding, words), <span class="n">2</span>) <span class="kw">AS</span> similarity, title, place\n   <span class="kw">FROM</span> photos\n   <span class="kw">ORDER BY</span> similarity <span class="kw">DESC</span>, file;';
  var lit=function(s){ return "'"+s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; };
  function byDateAgain(){ if(!rank) return; rank=null; note=''; sqlBox.innerHTML=byDate; sqlBox.dispatchEvent(new Event('query-changed')); render(); }
  siteSearchBox({form:document.getElementById('search-form'), input:input, box:sqlBox, table:'photos',
    start:function(){ sqlBox.innerHTML=BY_MEANING; document.getElementById('photo-foot').textContent='Embedding…'; },
    done:function(best,words){
      rank={}; best.forEach(function(b){ rank[b.key]=b.similarity; });
      note=best.length+' rows in set, nearest first. request is '+lit(words)+', embedded just now by EmbeddingGemma on Cloudflare Workers AI; each photo was embedded from its title, description and place with ClickHouse\'s aiEmbed.';
      if(list.length) render();  // a ?q= search can finish before photos.json loads
    },
    fail:function(){ document.getElementById('photo-foot').textContent='The embedding service is not answering right now; try again in a bit.'; }});
  document.getElementById('search-form').addEventListener('submit',function(){
    if(!input.value.trim()){ byDateAgain(); try{ history.replaceState(null,'',location.pathname); }catch(_){} }
  });
  input.addEventListener('search',function(){ if(!input.value.trim()) document.getElementById('search-form').requestSubmit(); });  // the ✕

  var lb=document.getElementById('lightbox');
  var cur=-1, closing=false, queued=null, opener=null;
  // each photo has its own URL: Back closes the viewer and the link can be shared
  var slug=function(p){return p.file.replace(/\.[^.]+$/,'')};
  function open(i,push){
    if(closing){ queued=i; return; }  // still closing; open once it lands
    show(i);
    var p=list.filter(function(q){return q.file})[cur];
    if(push) history.pushState({photo:true},'','#'+slug(p));
    if(lb.showModal&&!lb.open) lb.showModal();
  }
  function dec(v){ try{ return decodeURIComponent(v); }catch(_){ return null; } }
  function fromHash(){
    var h=dec(location.hash.slice(1)), real=list.filter(function(q){return q.file});
    if(h==null) return -1;  // malformed link
    for(var i=0;i<real.length;i++) if(slug(real[i])===h) return i;
    return -1;
  }
  // steps through real photos only, wrapping at the ends
  function show(i){
    var real=list.filter(function(p){return p.file}); if(!real.length) return;
    cur=(i+real.length)%real.length;
    var p=real[cur];
    var img=document.getElementById('lb-img'), cap=[p.title,p.place,p.date,p.camera].filter(Boolean).join(' · ');
    // swap the caption once the new photo has loaded
    img.onload=function(){ document.getElementById('lb-cap').textContent=cap; img.onload=null; };
    img.src='/photos/'+p.file; img.alt=p.alt||p.title;
    if(img.complete) img.onload();
    lb.setAttribute('aria-label',p.title);
    document.getElementById('lb-pos').textContent=(cur+1)+' / '+real.length;
    document.getElementById('lb-prev').parentNode.hidden=real.length<2;
    if(lb.open) history.replaceState(history.state,'','#'+slug(p));  // without piling up history
    var nx=real[(cur+1)%real.length]; if(nx!==p) new Image().src='/photos/'+nx.file;  // preload next
  }
  grid.addEventListener('click',function(e){
    var b=e.target.closest('.photo'); if(!b||b.disabled) return;
    var p=list[+b.dataset.i]; opener=b;
    open(list.filter(function(q){return q.file}).indexOf(p),true);
  });
  document.getElementById('lb-prev').addEventListener('click',function(){show(cur-1)});
  document.getElementById('lb-next').addEventListener('click',function(){show(cur+1)});
  lb.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){ e.preventDefault(); show(cur+1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); show(cur-1); }
  });
  var sx=null, sy=0;
  lb.addEventListener('touchstart',function(e){
    if(e.touches.length===1){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } else sx=null;  // a pinch is not a swipe
  },{passive:true});
  lb.addEventListener('touchend',function(e){
    if(sx===null) return;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) show(dx<0?cur+1:cur-1);
  });
  // every way of closing comes through here, so the URL goes back to the plain gallery
  function closeViewer(){
    if(!lb.open) return;
    lb.close(); refocus();
    if(history.state&&history.state.photo){ closing=true; history.back(); }
    else history.replaceState(null,'',location.pathname+location.search);
  }
  function refocus(){  // keyboard users keep their place
    var real=list.filter(function(q){return q.file}), p=real[cur];
    var b=opener&&document.body.contains(opener)?opener:p&&grid.querySelector('.photo[data-i="'+list.indexOf(p)+'"]');
    if(b) b.focus(); opener=null;
  }
  document.getElementById('lb-close').addEventListener('click',closeViewer);
  lb.addEventListener('cancel',function(e){ e.preventDefault(); closeViewer(); });  // Esc
  window.addEventListener('popstate',function(){  // browser Back/Forward
    if(closing){ closing=false; if(queued!=null){ var q=queued; queued=null; open(q,true); } return; }
    var i=fromHash();
    if(i<0){ if(lb.open){ lb.close(); refocus(); } }
    else open(i,false);
  });
  document.getElementById('lb-link').addEventListener('click',function(){
    var b=this, url=location.origin+location.pathname+location.hash;
    var done=function(){b.textContent='copied';setTimeout(function(){b.textContent='copy link'},1500)};
    try{ navigator.clipboard.writeText(url).then(done,function(){prompt('Link to this photo:',url)}); }catch(_){ prompt('Link to this photo:',url); }
  });
  lb.addEventListener('click',function(e){ if(e.target===lb) closeViewer(); });

  fetch('/photos.json').then(function(r){ if(!r.ok) throw r; return r.json(); })
    .then(function(d){ list=d.photos||[]; render(); var i=fromHash(); if(i>=0) open(i,false); })
    .catch(function(){ grid.outerHTML='<div class="empty-state">Couldn\'t load the photos. Try reloading the page.</div>'; });
})();
</script>
<script src="/run.js" defer></script>
</body>
</html>
