<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos · Tyler Hannan</title>
<meta name="description" content="A few favorite photos by Tyler Hannan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/">← tylerhannan.com</a><button type="button" class="theme" aria-label="Switch to light mode">☀ light</button></div>
  <section style="padding-top:24px">
    <p class="label">Photos</p>
    <div class="query"><span class="p">:) </span><span class="kw">SELECT</span> *
   <span class="kw">FROM</span> photos
   <span class="kw">ORDER BY</span> date <span class="kw">DESC</span>;</div>
    <div class="photos" id="photo-grid"></div>
    <p class="foot" id="photo-foot"></p>
  </section>
  <footer><span>tylerhannan.com</span><a href="/">home</a></footer>
</div>

<dialog id="lightbox" aria-label="Photo">
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <div class="lb-bar">
    <button type="button" class="copy" id="lb-close">close</button>
    <span class="lb-nav"><span id="lb-pos"></span><button type="button" class="copy" id="lb-prev" aria-label="Previous photo">‹ prev</button><button type="button" class="copy" id="lb-next" aria-label="Next photo">next ›</button></span>
  </div>
</dialog>

<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var ym=function(d){return String(d).slice(0,7)};
  var grid=document.getElementById('photo-grid'), list=[];

  function render(){
    if(!list.length){ grid.outerHTML='<div class="empty-state">0 rows in set. Add photos with <code>scripts/add-photo.sh</code>.</div>'; return; }
    list.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
    grid.innerHTML=list.map(function(p,i){
      var meta=[p.place,p.date&&ym(p.date)].filter(Boolean).map(esc).join(' · ');
      var focus=/^(top|bottom|left|right|center)$/.test(p.focus)?' style="object-position:'+p.focus+'"':'';  // which edge the grid crop keeps
      var inner=p.file?'<img src="/photos/'+esc(p.file)+'" alt="'+esc(p.alt||p.title)+'" loading="lazy"'+focus+'>':'<span class="ph">'+(p.example?'example slot':'no file')+'</span>';
      return '<button type="button" class="photo'+(p.file?'':' empty')+'" data-i="'+i+'"'+(p.file?'':' disabled')+'>'+inner+'<span class="pc"><span class="vt">'+esc(p.title)+'</span><span class="vm">'+meta+'</span></span></button>';
    }).join('');
    var real=list.filter(function(p){return p.file}).length;
    document.getElementById('photo-foot').textContent=list.length+' rows in set'+(real<list.length?' ('+(list.length-real)+' example)':'')+'.';
  }

  var lb=document.getElementById('lightbox');
  var cur=-1;
  // Viewer steps through real photos only (example slots have no file), wrapping at the ends.
  function show(i){
    var real=list.filter(function(p){return p.file}); if(!real.length) return;
    cur=(i+real.length)%real.length;
    var p=real[cur];
    document.getElementById('lb-img').src='/photos/'+p.file;
    document.getElementById('lb-img').alt=p.alt||p.title;
    document.getElementById('lb-cap').textContent=[p.title,p.place,p.date,p.camera].filter(Boolean).join(' · ');
    document.getElementById('lb-pos').textContent=(cur+1)+' / '+real.length;
    document.querySelector('.lb-nav').hidden=real.length<2;
    var nx=real[(cur+1)%real.length]; if(nx!==p) new Image().src='/photos/'+nx.file;  // preload next
  }
  grid.addEventListener('click',function(e){
    var b=e.target.closest('.photo'); if(!b||b.disabled) return;
    var p=list[+b.dataset.i];
    show(list.filter(function(q){return q.file}).indexOf(p));
    if(lb.showModal&&!lb.open) lb.showModal();
  });
  document.getElementById('lb-prev').addEventListener('click',function(){show(cur-1)});
  document.getElementById('lb-next').addEventListener('click',function(){show(cur+1)});
  lb.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){ e.preventDefault(); show(cur+1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); show(cur-1); }
  });
  var sx=null, sy=0;
  lb.addEventListener('touchstart',function(e){ if(e.touches.length===1){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } },{passive:true});
  lb.addEventListener('touchend',function(e){
    if(sx===null) return;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) show(dx<0?cur+1:cur-1);
  });
  document.getElementById('lb-close').addEventListener('click',function(){lb.close()});
  lb.addEventListener('click',function(e){ if(e.target===lb) lb.close(); });

  fetch('/photos.json').then(function(r){return r.json()}).then(function(d){list=d.photos||[];render()}).catch(function(){render()});
})();
</script>
</body>
</html>
